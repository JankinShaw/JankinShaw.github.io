<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.data.main_info.name }}</title>

  <!-- The website uses a local, system-font design with no visual framework. -->
  <link rel="icon" href="{{ '/libs/icon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | relative_url }}">
  <script src="{{ '/libs/custom/my_js.js' | relative_url }}" defer></script>
</head>
<body class="page-{{ page.nav | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Desktop navigation follows the quiet, left-rail structure of the visual reference. -->
  <header class="site-header" data-site-header>
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.main_info.name }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
      <span class="sr-only">Toggle navigation</span>
      <span>Menu</span>
    </button>
    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-site-nav>
      <a{% if page.nav == 'home' %} class="is-active"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a{% if page.nav == 'about' %} class="is-active"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
      <a{% if page.nav == 'research' %} class="is-active"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
      <a{% if page.nav == 'experience' %} class="is-active"{% endif %} href="{{ '/experience/' | relative_url }}">Experience</a>
    </nav>
    <div class="sidebar-links">
      <a href="{{ site.data.main_info.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.data.main_info.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© <span data-current-year>2026</span> {{ site.data.main_info.name }}</p>
      <p>Built with Jekyll · Hosted on GitHub Pages</p>
      <p class="font-credit">Chinese labels: TW-Kai · OFL 1.1</p>
    </div>
  </footer>

  {% include google_analytics.html %}
</body>
</html>
