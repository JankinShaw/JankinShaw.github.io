<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffff8">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.data.main_info.name }}</title>

  <!-- ET Book is served locally for the Tufte-inspired reading layout. -->
  <link rel="icon" href="{{ '/libs/favicon.svg' | relative_url }}?v=20261015-atom" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | relative_url }}?v={{ site.asset_version }}">
  <script src="{{ '/libs/custom/translations.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  <script src="{{ '/libs/custom/my_js.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
</head>
<body class="page-{{ page.nav | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- A compact text navigation keeps the focus on the biography. -->
  <header class="site-header" data-site-header>
    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-site-nav>
      <a{% if page.nav == 'home' %} class="is-active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
    </nav>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© <span data-current-year>2026</span> {{ site.data.main_info.name }}</p>
      <p>Built with Jekyll · Hosted on GitHub Pages</p>
    </div>
  </footer>

  {% include google_analytics.html %}
</body>
</html>
