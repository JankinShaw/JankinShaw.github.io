<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf9">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ site.data.main_info.name }}</title>
  <link rel="icon" href="{{ '/libs/favicon.svg' | relative_url }}?v=20261031-y" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/libs/custom/photography.css' | relative_url }}?v={{ site.asset_version }}">
  <link rel="stylesheet" href="{{ '/libs/custom/language.css' | relative_url }}?v={{ site.asset_version }}">
  <script src="{{ '/libs/custom/locale-data.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  <script src="{{ '/libs/custom/language.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  <script src="{{ '/libs/custom/identity.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to photograph</a>
  <header class="photography-header">
    <span class="photography-name">{{ site.data.main_info.name }}</span>
    <nav aria-label="Primary navigation"><a href="{{ '/academics/' | relative_url }}">About</a></nav>
  </header>
  <main id="main-content">{{ content }}</main>
  {% include languages.html %}
  {% include google_analytics.html %}
</body>
</html>
