<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.blog_title | escape }}</title>
<link rel="stylesheet" href="{{ '/assets/blog/minimal.css' | relative_url }}"><link rel="alternate" type="application/rss+xml" title="{{ site.blog_title | escape }}" href="{{ '/blog/feed.xml' | relative_url }}">
{% include journal-math.html %}</head>
<body><header><a class="site-title" href="{{ '/blog/' | relative_url }}"><h1>{{ site.blog_title }}</h1></a>
<nav aria-label="Main navigation"><a href="{{ '/blog/' | relative_url }}">Home</a> <a href="{{ '/blog/writing/' | relative_url }}">Blog</a></nav></header>
<main id="main">{{ content }}</main><footer><a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a> · <a href="{{ '/' | relative_url }}">Home</a></footer>{% include analytics.html %}</body></html>
