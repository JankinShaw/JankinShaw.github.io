---
layout: default
---
<article><h1>{{ page.title }}</h1><p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time> · Author: Yingjie Xiao</p>
<div class="prose">{{ content }}</div>
{% if page.tags.size > 0 %}<p class="meta tags">{% for tag in page.tags %}<a href="{{ '/writing/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a> {% endfor %}</p>{% endif %}
</article><p><a href="{{ '/writing/' | relative_url }}">← All posts</a></p>
