<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <script>try { const theme = localStorage.getItem('journal-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme; } catch (_) {}</script>
  <link rel="stylesheet" href="{{ '/assets/journal.css' | relative_url }}">
  <script src="{{ '/assets/journal.js' | relative_url }}" defer></script>
  {% include math.html %}
</head>
<body class="{% if page.home %}home{% else %}inside{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="identity" href="{{ '/' | relative_url }}" aria-label="Yingjie — blog home">
      <span class="monogram" aria-hidden="true">y.</span>
      <span class="site-name">Yingjie, in words<span class="end-dot">.</span></span>
    </a>
    <nav aria-label="Blog navigation">
      <a href="{{ '/' | relative_url }}" {% if page.home %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/writing/' | relative_url }}" {% if page.section == 'writing' or page.collection == 'posts' %}aria-current="page"{% endif %}>Posts</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.section == 'tags' %}aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.section == 'archive' or page.collection == 'archive' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" aria-pressed="false" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </nav>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <p class="footer-small">Yingjie Xiao · Local preview</p>
  </footer>
</body>
</html>
