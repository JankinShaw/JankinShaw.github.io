---
layout: base
title: Tags
section: tags
permalink: /tags/
---
<header class="page-header"><h1>Tags</h1></header>
{% assign tags = site.tags | sort %}
<nav class="tag-filters" aria-label="Filter by tag">
  <a href="#all" data-tag-filter="" aria-current="true">All</a>
{% for tag in tags %}
  <a id="tag-{{ tag[0] | slugify: 'latin' }}" href="#tag-{{ tag[0] | slugify: 'latin' }}" data-tag-filter="{{ tag[0] | escape }}">{{ tag[0] }} <span class="count">{{ tag[1] | size }}</span></a>
{% endfor %}
</nav>
<ul class="post-list" data-tag-posts>
{% for post in site.posts %}
  <li data-post-tags="{{ post.tags | jsonify | escape }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%m.%d' }}</time><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
{% endfor %}
</ul>
<p class="tag-empty" hidden>No posts.</p>
