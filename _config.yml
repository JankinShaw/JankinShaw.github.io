title: "Yingjie Xiao"
description: "Computational linguistics, linguistic diversity, and academic writing research."
url: "https://jankinshaw.github.io"
baseurl: ""
lang: "en"
timezone: "Europe/Berlin"
goatcounter_endpoint: "https://jankinshaw.goatcounter.com/count"
asset_version: "20261109-language-font"

source: .
destination: ./_site
includes_dir: _includes
layouts_dir: _layouts

markdown: kramdown
blog_title: "Vicissitude."
blog_theme_toggle: false # Set true to show the light/dark switch.
blog_description: "Notes on language, reading, and everyday life."

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: journal_post
      permalink: /blog/:title/
  - scope:
      path: ""
      type: blog_archive
    values:
      layout: journal_post

collections:
  blog_archive:
    output: true
    permalink: /blog/archive/:name/
  projects:
    output: false

exclude:
  - Preview.command
  - README.md
  - Gemfile
  - Gemfile.lock
  - __deploy.sh
